# Uso opcional (Docker direto na VPS). No EasyPanel nao precisa deste arquivo.
services:
  wacalls:
    build: .
    container_name: wacalls
    restart: always
    # So aceita conexao vinda do proprio servidor. Quem publica com
    # cadeado (https) e o painel/proxy na frente.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      WACALLS_USER: ${WACALLS_USER:-admin}
      WACALLS_PASSWORD: ${WACALLS_PASSWORD:?defina a senha}
    volumes:
      - wacalls-data:/data

volumes:
  wacalls-data:
